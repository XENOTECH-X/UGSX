<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UGSX</title>

<style>
:root{
    --bg-main:#141414;
    --bg-panel:#1f1f1f;
    --bg-soft:#2a2a2a;
    --accent:#8B0000;
    --text-main:#f1f1f1;
    --text-muted:#888;
    --transition:.25s ease;
}

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#111,#1c1c1c);
    color:var(--text-main);
    display:flex;
}

/* ================= Sidebar ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:220px;
    height:100vh;
    background:#0f0f0f;
    padding:15px 10px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
    box-shadow:4px 0 25px rgba(0,0,0,.7);
    transition:width var(--transition);
    z-index:1000;
}

.sidebar.collapsed{ width:70px; }

.sidebar-toggle{
    background:var(--accent);
    border:none;
    padding:10px;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.sidebar-btn{
    background:var(--bg-soft);
    border:none;
    padding:8px;
    border-radius:6px;
    color:white;
    cursor:pointer;
    transition:var(--transition);
    font-weight:600;
}

.sidebar-btn:hover{
    background:var(--accent);
    transform:translateX(4px);
}

.sidebar-btn.active{
    background:var(--accent);
}

.sidebar-btn.empty{
    opacity:.25;
    cursor:default;
}

.sidebar.collapsed .sidebar-btn{
    text-align:center;
}

/* ================= Main ================= */

.main-content{
    margin-left:240px;
    padding:40px 30px;
    flex:1;
    transition:margin-left var(--transition);
}

.sidebar.collapsed ~ .main-content{
    margin-left:90px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

h2{
    text-align:center;
    color:var(--text-muted);
    font-weight:400;
}

.source-links {
    margin: 18px 0 8px;
    font-size: 14px;
    line-height: 1.8;
}

.source-links a {
    color: #c77b7b;
    text-decoration: none;
}

.source-links a:hover {
    text-decoration: underline;
}

.source-separator {
    color: var(--text-muted);
    padding: 0 8px;
}

/* ================= Search ================= */

.search-container{
    position:sticky;
    top:0;
    padding:20px 0;
    background:linear-gradient(180deg,#141414 85%,transparent);
    text-align:center;
    z-index:500;
}

#searchInput{
    width:100%;
    max-width:600px;
    padding:12px 18px;
    border-radius:30px;
    border:1px solid #333;
    background:#222;
    color:white;
    font-size:15px;
    outline:none;
    transition:var(--transition);
}

#searchInput:focus{
    border-color:var(--accent);
    box-shadow:0 0 12px rgba(139,0,0,.6);
}

/* ================= Sections ================= */

.letter-section{
    margin:40px auto;
    padding:20px;
    max-width:900px;
    background:var(--bg-panel);
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:opacity .2s ease;
}

.letter-header{
    color:var(--accent);
    font-size:24px;
    font-weight:bold;
    border-bottom:1px solid #333;
    padding-bottom:6px;
    margin-bottom:15px;
}

.buttons-container{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.file-btn,
.buttons-container input[type="button"]{
    font:inherit;
    font-size:14px;
    background:#333;
    border:1px solid #444;
    padding:12px;
    border-radius:6px;
    color:white;
    cursor:pointer;
    transition:var(--transition);
    text-align:left;
}

.file-btn:hover,
.buttons-container input[type="button"]:hover{
    background:var(--accent);
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(139,0,0,.5);
}

.hidden{ display:none; }

.empty-message{
    color:var(--text-muted);
    text-align:center;
    font-style:italic;
}

.buttons-container input[type="button"]{ height:auto !important; }

/* ===== Hide Scrollbars But Keep Scroll ===== */

::-webkit-scrollbar {
    width: 0px;
    height: 0px;
}

* {
    scrollbar-width: none;
}

body {
    -ms-overflow-style: none;
}

/* ================= Game Overlay ================= */
#viewer{display:none;position:fixed;inset:0;z-index:5000;background:#000;flex-direction:column;}
#viewer.open{display:flex;}
#viewerBar{display:flex;align-items:center;justify-content:center;gap:6px;padding:3px;background:#0f0f0f;border-bottom:1px solid var(--accent);}
#viewerBar button{background:#2a2a2a;color:#fff;border:none;padding:3px 14px;cursor:pointer;font:600 12px 'Segoe UI',sans-serif;border-radius:4px;letter-spacing:.3px;}
#viewerBar button:hover{background:var(--accent);}
#vClose{background:var(--accent)!important;}
#vClose:hover{filter:brightness(1.25);}
#viewerHost{flex:1;display:flex;}
#viewerHost iframe{flex:1;border:0;background:#fff;width:100%;height:100%;}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
</div>

<div class="main-content">

<h1>UGSX</h1>
<h2>This Is No Longer Maintained</h2>
<h1>Jon Stearns</h1>


<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search...">
</div>

<div id="sections-container"></div>

</div>

<div id="viewer">
    <div id="viewerBar"><button id="vFull">Fullscreen</button><button id="vClose">Close Game</button></div>
    <div id="viewerHost"></div>
</div>

<script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script>
<script>
    // Automatically load the same game list used by AASINGLEFILE.
    const gamesScript = document.createElement('script');
    gamesScript.src = 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@latest/games.js';
    gamesScript.onerror = () => {
        console.error('Could not automatically load the UGS game list. Check your internet connection.');
    };
    document.body.appendChild(gamesScript);
</script>

<script>
/*
 * Click a game -> fetch its HTML -> write it into an about:blank iframe
 * inside a full-screen overlay. "Close Game" tears the iframe down.
 */
// Same source games.js uses for its own click handler, with a raw GitHub fallback.
const GAME_SOURCES = [
    'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/',
    'https://raw.githubusercontent.com/bubbls/ugs-singlefile/refs/heads/main/UGS-Files/'
];

const viewer = document.getElementById('viewer');
const viewerHost = document.getElementById('viewerHost');

function closeGame() {
    if (document.fullscreenElement) document.exitFullscreen();
    viewer.classList.remove('open');
    viewerHost.innerHTML = ''; // removing the iframe stops the game
}

document.getElementById('vClose').onclick = closeGame;
document.getElementById('vFull').onclick = () => {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    // Fullscreen just the game area so it fills the whole screen
    const f = viewerHost.requestFullscreen || viewerHost.webkitRequestFullscreen;
    if (f) f.call(viewerHost);
};
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && viewer.classList.contains('open')) closeGame();
});

function showStatus(msg) {
    viewerHost.innerHTML = '';
    const d = document.createElement('div');
    d.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#ccc;font:15px/1.6 monospace;white-space:pre-wrap;word-break:break-all;';
    d.textContent = msg;
    viewerHost.appendChild(d);
    viewer.classList.add('open');
}

function openGame(html) {
    viewerHost.innerHTML = '';
    const frame = document.createElement('iframe');
    // '*' so features work even when the launcher is a file:// page (opaque origin)
    frame.setAttribute('allow', 'fullscreen *; autoplay *; gamepad *; clipboard-write *; clipboard-read *; encrypted-media *; pointer-lock *; accelerometer *; gyroscope *; microphone *; camera *; midi *; picture-in-picture *');
    viewerHost.appendChild(frame);
    viewer.classList.add('open');

    try {
        // Same as the original: open about:blank, then write the game into it
        const doc = frame.contentDocument;
        if (!doc) throw new Error('iframe document is not accessible (null)');
        doc.open();
        doc.write(html);
        doc.close();
        frame.focus();
    } catch (e) {
        console.error('Write failed:', e);
        showStatus('Could not write the game into the overlay:\n' + e.message + '\n\n(' + html.length + ' bytes fetched)');
    }
}

document.addEventListener('click', function (event) {
    const button = event.target.closest('#sections-container input[type="button"], #sections-container .file-btn');
    if (!button) return;

    const fileName = (button.value || button.dataset.file || button.textContent || '').trim();
    if (!fileName) return;

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    const normalized = fileName.includes('.') ? fileName : fileName + '.html';
    const encoded = encodeURIComponent(normalized);

    showStatus('Loading ' + fileName + '...');

    (async () => {
        const errors = [];
        for (const base of GAME_SOURCES) {
            try {
                const r = await fetch(base + encoded + '?t=' + Date.now());
                if (!r.ok) throw new Error('HTTP ' + r.status + ' from ' + base);
                const html = await r.text(); // unmodified, same as the original loader

                return html;
            } catch (e) { errors.push(e.message); }
        }
        throw new Error(errors.join('\n'));
    })()
        .then(openGame)
        .catch(error => {
            console.error('Failed to load game:', error);
            showStatus('Failed to load ' + fileName + ':\n' + error.message);
        });
}, true);
</script>

</body>
</html>
